# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_waste-batteries-reg-frontend
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/waste-batteries-reg-frontend
sonar.links.ci=https://github.com/DEFRA/waste-batteries-reg-frontend/actions
sonar.links.scm=https://github.com/DEFRA/waste-batteries-reg-frontend
sonar.links.issue=https://github.com/DEFRA/waste-batteries-reg-frontend/issues

# Production code. Everything else the repo contains is test code, and is
# declared as such below so it is analysed with test rules rather than
# production ones, and stays out of the coverage figure.
sonar.sources=src/
sonar.exclusions=src/**/*.test.js

# Unit tests sit beside the code they cover; the Playwright journeys and the
# helpers shared by both suites live outside src/
sonar.tests=src/,e2e/,test-helpers/
sonar.test.inclusions=src/**/*.test.js,e2e/**/*.js,test-helpers/**/*.js

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

# Repetition between tests is usually the tests being readable one at a time
sonar.cpd.exclusions=src/**/*.test.js,e2e/**/*.js,test-helpers/**/*.js
