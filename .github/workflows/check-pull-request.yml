name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Sonar reads git blame to work out what counts as new code, and it
          # cannot do that from a one-commit clone
          fetch-depth: 0

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - run: |
          npm ci --ignore-scripts
          npm run build:frontend
          npm run format:check
          npm run lint
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-frontend-template .
          exit $?

      # Runs last in this job so ./coverage/lcov.info from `npm test` above is
      # on disk. Dependabot PRs cannot see the token, so they skip rather than
      # fail. Version is on https://github.com/marketplace/actions/official-sonarqube-scan
      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # NODE_ENV=test serves built assets rather than running vite, so the
      # instances Playwright starts need .public to exist
      - name: Build frontend assets
        run: npm run build:frontend

      # The lockfile's own binary, not npx: npx would resolve a version at run
      # time and can fetch a package on demand, so the browser build would stop
      # being pinned to the Playwright the tests actually run against
      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # The journeys sign in against the real Defra ID stub, read sessions out of
      # Redis, and drive the compose `frontend` service for the containerised
      # journey — so the whole stack comes up, not just the stub
      - name: Start supporting services
        run: docker compose up -d --wait floci redis cdp-defra-id-stub frontend

      # `--wait` only waits for a container to be running when it has no
      # healthcheck, and the containerised journey skips itself against an app
      # that is not answering yet
      - name: Wait for the containerised app
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The compose frontend service did not become healthy"
          docker compose logs frontend
          exit 1

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/.logs/
            compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore
