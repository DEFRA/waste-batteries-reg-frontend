name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Sonar reads git blame to work out what counts as new code, and it
          # cannot do that from a one-commit clone
          fetch-depth: 0

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Security audit
        run: npm run security-audit

      - run: |
          npm ci --ignore-scripts
          npm run build:frontend
          npm run format:check
          npm run lint
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-frontend-template .
          exit $?

      # Runs last in this job so ./coverage/lcov.info from `npm test` above is
      # on disk. Dependabot PRs cannot see the token, so they skip rather than
      # fail. Version is on https://github.com/marketplace/actions/official-sonarqube-scan
      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      COMPOSE_FILE_ARGS: -f compose.yml -f compose-github.override-zap.yml
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # NODE_ENV=test serves built assets rather than running vite, so the
      # instances Playwright starts need .public to exist
      - name: Build frontend assets
        run: npm run build:frontend

      # The lockfile's own binary, not npx: npx would resolve a version at run
      # time and can fetch a package on demand, so the browser build would stop
      # being pinned to the Playwright the tests actually run against
      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # The journeys sign in against the real Defra ID stub, read sessions out of
      # Redis, and drive the compose `frontend` service for the containerised
      # journey — so the whole stack comes up, not just the stub. ZAP is started
      # here too so Playwright can proxy Chromium through it.
      - name: Start supporting services
        id: start-compose
        run: |
          mkdir -p zap-reports
          docker compose ${COMPOSE_FILE_ARGS} up -d --wait floci redis cdp-defra-id-stub frontend
          # ZAP is started without --wait: the image healthcheck probes localhost,
          # which the overlay remaps to the host gateway, so --wait would hang
          # until we override it — and even then the daemon can take >60s.
          # Readiness is the root-CA fetch in the next step.
          docker compose ${COMPOSE_FILE_ARGS} up -d zap

      # `--wait` only waits for a container to be running when it has no
      # healthcheck, and the containerised journey skips itself against an app
      # that is not answering yet
      - name: Wait for the containerised app
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The compose frontend service did not become healthy"
          docker compose ${COMPOSE_FILE_ARGS} logs frontend
          exit 1

      # Root CA fetch is the readiness probe and also the cert Node needs if
      # anything HTTPS is intercepted. Two minutes: -silent still leaves a
      # slow JVM + CA generation on first boot.
      - name: Prepare ZAP
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/OTHER/core/other/rootcert/ -o "$RUNNER_TEMP/zap-root-ca.pem"; then
              echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/zap-root-ca.pem" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "ZAP did not become ready on port 8080"
          docker compose ${COMPOSE_FILE_ARGS} logs zap
          exit 1

      - name: Run end-to-end tests
        id: e2e-tests
        env:
          ZAP_PROXY_URL: http://127.0.0.1:8080
          ZAP_PROXY_API_URL: http://127.0.0.1:8080
        run: npm run test:e2e

      # The @zap spec writes these too; this catches the case where journeys
      # fail and the dependent zap project never runs.
      - name: Export ZAP reports
        if: always()
        run: |
          mkdir -p zap-reports
          curl -fsS http://127.0.0.1:8080/OTHER/core/other/htmlreport/ -o zap-reports/zap-report.html || true
          curl -fsS http://127.0.0.1:8080/OTHER/core/other/jsonreport/ -o zap-reports/zap-report.json || true

      - name: Collect service logs
        if: failure()
        run: docker compose ${COMPOSE_FILE_ARGS} logs --no-color > compose-logs.txt

      - name: Upload test artefacts
        if: always()
        id: upload-report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/.logs/
            compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload ZAP report
        if: always()
        id: upload-zap-report
        uses: actions/upload-artifact@v4
        with:
          name: zap-test-report
          path: zap-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment test report links on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const statusEmoji = '${{ steps.e2e-tests.outcome }}' === 'success' ? '✅' : '❌';
            const playwrightLine = '${{ steps.upload-report.outcome }}' === 'success'
              ? `\n\n📥 [Download Playwright Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-report.outputs.artifact-id }})`
              : '';
            const zapLine = '${{ steps.upload-zap-report.outcome }}' === 'success'
              ? `\n\n🔒 [Download ZAP Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-zap-report.outputs.artifact-id }})`
              : '';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 End-to-end test report ${statusEmoji}\n\nThe Playwright and ZAP reports have been generated and are available as artefacts.${playwrightLine}${zapLine}`
            })

      - name: Stop Docker Compose services
        if: always() && steps.start-compose.outcome == 'success'
        run: docker compose ${COMPOSE_FILE_ARGS} down
